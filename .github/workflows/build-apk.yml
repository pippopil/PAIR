name: Build Android APK & Publish Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/KinoMatch-build-${{ github.run_number }}.apk

      - name: Generate Changelog & Release Notes
        id: changelog
        run: |
          BUILD_NUM="${{ github.run_number }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" 2>/dev/null || git log -n 5 --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))")
          else
            COMMITS=$(git log -n 10 --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))")
          fi
          
          cat <<EOF > release_notes.md
          ## 🎬 KinoMatch — Релиз со сборкой #${BUILD_NUM}
          
          **Дата сборки:** ${DATE}
          **Номер билда:** \`#${BUILD_NUM}\`
          **Коммит:** [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          
          ### 📱 Установка приложения:
          Скачайте файл **\`KinoMatch-build-${BUILD_NUM}.apk\`** из блока Assets ниже и откройте его на телефоне Android.
          
          ### 📝 Что нового в этой сборке:
          ${COMMITS}
          
          ---
          *Сборка и релиз сформированы автоматически через GitHub Actions.*
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "KinoMatch v1.0.${{ github.run_number }} (Сборка #${{ github.run_number }})"
          body_path: release_notes.md
          files: release-assets/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
